name: CI-CD GitOps Demo App (Helm)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write      # to push updated values.yaml
      packages: write      # to push image to GHCR

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.event.repository.name }}  # e.g. "soundsystem"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/download/v4.49.2/yq_linux_amd64 -O yq
          chmod +x yq
          sudo mv yq /usr/local/bin/yq

      - name: Update Helm values image repo & tag
        env:
          NEW_TAG: ${{ github.sha }}
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        run: |
          yq -i '
            .image.repository = strenv(IMAGE_REPO) |
            .image.tag = strenv(NEW_TAG)
          ' k8s/helm/soundsystem/values.yaml

          echo "Updated Helm values.yaml:"
          cat k8s/helm/soundsystem/values.yaml

      - name: Commit and push updated Helm values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/helm/soundsystem/values.yaml
          git commit -m "Update Helm image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push origin main || echo "No changes to push"
