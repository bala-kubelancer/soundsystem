name: CI-CD GitOps Demo App (Kubernetes Manifest)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write      # to push updated manifest
      packages: write      # to push image to GHCR

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.event.repository.name }}  # e.g. "soundsystem"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: app/. # the root of the repository contains the Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest


      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/download/v4.49.2/yq_linux_amd64 -O yq
          chmod +x yq
          sudo mv yq /usr/local/bin/yq

      - name: Update kubernetes manifest image tag
        env:
          NEW_TAG: ${{ github.sha }}
        run: |
          yq -i '
            .spec.template.spec.containers[0].image |=
            sub(":[^:]*$"; ":" + strenv(NEW_TAG))
          ' k8s/manifest/deployment.yaml
          cat k8s/manifest/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/manifest/deployment.yaml
          git commit -m "Update image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push origin main || echo "No changes to push"
