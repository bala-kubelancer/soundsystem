apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: soundsystem
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/bala-kubelancer/soundsystem.git
    targetRevision: HEAD
    path: k8s/helm/soundsystem/
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: soundsystem

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true