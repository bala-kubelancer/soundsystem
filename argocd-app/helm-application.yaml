apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: soundsystem
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR-GITHUB-USER/soundsystem.git
    targetRevision: main
    path: helm/soundsystem

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true